<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vehicle Speed Monitor</title>

    <script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 10px;
            font-family: Arial, sans-serif;
        }

        .speed-box {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            background: #fff;
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .status {
            font-size: 14px;
            color: #555;
        }
    </style>
</head>

<body>

<div class="speed-box">

    <div class="title">
        🚍 Vehicle Speed Monitor
    </div>

    <div class="status" id="status">
        Loading...
    </div>

</div>

<script>

JFCustomWidget.subscribe("ready", function() {

    console.log("Vehicle Speed Monitor: READY");

    document.getElementById("status").textContent =
        "GPS component ready";

});


JFCustomWidget.subscribe("submit", function() {

    console.log("Vehicle Speed Monitor: SUBMIT");

    const result = {
        status: "Test successful",
        averageSpeed: 0,
        maximumSpeed: 0,
        durationSeconds: 0,
        gpsAccuracy: null,
        readingsUsed: 0
    };

    /*
     * Tell Jotform that the widget has completed.
     */

    JFCustomWidget.sendSubmit({

        valid: true,

        value: JSON.stringify(result)

    });

});

</script>

</body>
</html>
