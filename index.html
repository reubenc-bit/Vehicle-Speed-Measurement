<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vehicle Speed Monitor</title>

    <script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 12px;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 400px;
            margin: auto;
            text-align: center;
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .status {
            padding: 9px;
            border-radius: 6px;
            background: #f1f1f1;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .speed {
            font-size: 32px;
            font-weight: bold;
            margin: 8px 0;
        }

        .unit {
            font-size: 13px;
            color: #666;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px;
            margin-top: 10px;
        }

        .detail {
            background: #f7f7f7;
            border-radius: 6px;
            padding: 7px;
            font-size: 11px;
        }

        .detail strong {
            display: block;
            font-size: 14px;
            margin-top: 3px;
        }

        .message {
            margin-top: 8px;
            font-size: 11px;
            line-height: 1.4;
        }

        .success {
            color: #167c3a;
        }

        .warning {
            color: #9a6700;
        }

        .error {
            color: #b00020;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="title">
        🚍 Automatic Vehicle Speed Measurement
    </div>

    <div id="status" class="status">
        Initialising GPS...
    </div>

    <div class="speed">
        <span id="currentSpeed">0.0</span>
        <span class="unit">km/h</span>
    </div>

    <div class="details">

        <div class="detail">
            Average Speed
            <strong id="averageSpeed">0.0 km/h</strong>
        </div>

        <div class="detail">
            Maximum Speed
            <strong id="maximumSpeed">0.0 km/h</strong>
        </div>

        <div class="detail">
            Duration
            <strong id="duration">0 sec</strong>
        </div>

        <div class="detail">
            GPS Accuracy
            <strong id="accuracy">-- m</strong>
        </div>

        <div class="detail">
            GPS Readings
            <strong id="readings">0</strong>
        </div>

        <div class="detail">
            Distance
            <strong id="distance">0 m</strong>
        </div>

    </div>

    <div id="message" class="message"></div>

</div>


<script>

"use strict";

/*
===========================================================
 VEHICLE SPEED MONITOR
 JOTFORM VERSION
===========================================================

 Features:

 - Automatically requests GPS
 - Uses browser GPS
 - Uses coords.speed when available
 - Falls back to distance/time calculation
 - Calculates average speed
 - Calculates maximum speed
 - Calculates total distance
 - Tracks GPS accuracy
 - Tracks number of readings
 - Sends JSON to Jotform continuously
 - Sends final JSON when form is submitted
 - Reports GPS errors instead of silently failing

===========================================================
*/


/* ========================================================
   SETTINGS
======================================================== */

const SETTINGS = {

    /*
       GPS readings with accuracy worse than this
       are not used for speed calculation.
    */
    maximumAccuracyMeters: 100,

    /*
       Reject impossible GPS jumps.
    */
    maximumAllowedSpeedKmh: 200,

    /*
       Minimum distance required before calculating
       movement speed from two GPS positions.
    */
    minimumDistanceMeters: 1,

    /*
       Ignore readings that arrive too quickly.
    */
    minimumTimeSeconds: 1

};


/* ========================================================
   VARIABLES
======================================================== */

let watchId = null;

let measurementStarted = false;

let startTime = null;

let lastPosition = null;

let lastAcceptedTime = null;

let totalDistanceMeters = 0;

let acceptedReadings = 0;

let maximumSpeedKmh = 0;

let currentSpeedKmh = 0;

let latestAccuracy = null;

let measurementStatus = "Starting";

let submitted = false;


/* ========================================================
   HTML HELPERS
======================================================== */

function setStatus(text) {

    document.getElementById("status").textContent = text;

}


function setMessage(text, type) {

    const element =
        document.getElementById("message");

    element.textContent = text;

    element.className =
        "message " + (type || "");

}


/* ========================================================
   ROUND NUMBER
======================================================== */

function roundNumber(value, decimals) {

    if (!Number.isFinite(value)) {
        return 0;
    }

    const multiplier =
        Math.pow(10, decimals);

    return Math.round(
        value * multiplier
    ) / multiplier;
}


/* ========================================================
   HAVERSINE DISTANCE
======================================================== */

function distanceBetween(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const earthRadius = 6371000;

    const latitude1 =
        lat1 * Math.PI / 180;

    const latitude2 =
        lat2 * Math.PI / 180;

    const deltaLatitude =
        (lat2 - lat1) *
        Math.PI / 180;

    const deltaLongitude =
        (lon2 - lon1) *
        Math.PI / 180;

    const a =
        Math.sin(deltaLatitude / 2) *
        Math.sin(deltaLatitude / 2) +

        Math.cos(latitude1) *
        Math.cos(latitude2) *

        Math.sin(deltaLongitude / 2) *
        Math.sin(deltaLongitude / 2);

    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );

    return earthRadius * c;
}


/* ========================================================
   GET DURATION
======================================================== */

function getDurationSeconds() {

    if (!startTime) {
        return 0;
    }

    return (
        Date.now() - startTime
    ) / 1000;
}


/* ========================================================
   GET AVERAGE SPEED
======================================================== */

function getAverageSpeed() {

    const duration =
        getDurationSeconds();

    if (
        duration <= 0 ||
        totalDistanceMeters <= 0
    ) {
        return 0;
    }

    return (
        (totalDistanceMeters / 1000) /
        (duration / 3600)
    );
}


/* ========================================================
   UPDATE SCREEN
======================================================== */

function updateUI() {

    const duration =
        getDurationSeconds();

    const average =
        getAverageSpeed();

    document.getElementById(
        "currentSpeed"
    ).textContent =
        roundNumber(
            currentSpeedKmh,
            1
        );

    document.getElementById(
        "averageSpeed"
    ).textContent =
        roundNumber(
            average,
            1
        ) + " km/h";

    document.getElementById(
        "maximumSpeed"
    ).textContent =
        roundNumber(
            maximumSpeedKmh,
            1
        ) + " km/h";

    document.getElementById(
        "duration"
    ).textContent =
        Math.round(duration) + " sec";

    document.getElementById(
        "accuracy"
    ).textContent =
        latestAccuracy !== null
            ? roundNumber(
                latestAccuracy,
                1
            ) + " m"
            : "-- m";

    document.getElementById(
        "readings"
    ).textContent =
        acceptedReadings;

    document.getElementById(
        "distance"
    ).textContent =
        totalDistanceMeters >= 1000
            ? roundNumber(
                totalDistanceMeters / 1000,
                2
            ) + " km"
            : Math.round(
                totalDistanceMeters
            ) + " m";
}


/* ========================================================
   CREATE RESULT
======================================================== */

function createResult() {

    const duration =
        getDurationSeconds();

    const average =
        getAverageSpeed();

    return {

        estimatedAverage:
            roundNumber(
                average,
                1
            ),

        estimatedMaximum:
            roundNumber(
                maximumSpeedKmh,
                1
            ),

        speedMeasurement:
            Math.round(
                duration
            ),

        gpsAccuracy:
            latestAccuracy !== null
                ? roundNumber(
                    latestAccuracy,
                    1
                )
                : null,

        gpsReadings:
            acceptedReadings,

        speedMeasurement70:
            measurementStatus,

        totalDistanceMeters:
            roundNumber(
                totalDistanceMeters,
                1
            ),

        currentSpeed:
            roundNumber(
                currentSpeedKmh,
                1
            )
    };
}


/* ========================================================
   SEND DATA TO JOTFORM
======================================================== */

function sendDataToJotform() {

    const result =
        createResult();

    try {

        JFCustomWidget.sendData({

            valid: true,

            value:
                JSON.stringify(result)

        });

        console.log(
            "Vehicle Speed Monitor data sent:",
            result
        );

    }

    catch (error) {

        console.error(
            "Jotform sendData error:",
            error
        );

    }
}


/* ========================================================
   GPS SUCCESS
======================================================== */

function handlePosition(position) {

    if (submitted) {
        return;
    }

    const latitude =
        position.coords.latitude;

    const longitude =
        position.coords.longitude;

    const accuracy =
        position.coords.accuracy;

    /*
       Browser may provide native GPS speed.
       It is normally expressed in metres/second.
    */

    const nativeSpeed =
        position.coords.speed;


    latestAccuracy =
        Number.isFinite(accuracy)
            ? accuracy
            : null;


    /*
       Display that GPS is being received
       even if accuracy isn't good enough yet.
    */

    if (
        !Number.isFinite(accuracy) ||
        accuracy > SETTINGS.maximumAccuracyMeters
    ) {

        measurementStatus =
            "Waiting for accurate GPS";

        setStatus(
            "GPS detected - waiting for better accuracy"
        );

        setMessage(
            "GPS accuracy: " +
            roundNumber(
                accuracy,
                1
            ) +
            " m",
            "warning"
        );

        updateUI();

        sendDataToJotform();

        return;
    }


    const now =
        Date.now();


    /* ====================================================
       FIRST VALID READING
    ==================================================== */

    if (!measurementStarted) {

        measurementStarted = true;

        startTime = now;

        lastAcceptedTime = now;

        lastPosition = {

            latitude:
                latitude,

            longitude:
                longitude

        };

        acceptedReadings = 1;

        measurementStatus =
            "Measuring";

        setStatus(
            "GPS measurement active"
        );

        setMessage(
            "GPS tracking is active.",
            "success"
        );

        /*
           If native GPS speed is already available,
           use it.
        */

        if (
            Number.isFinite(nativeSpeed) &&
            nativeSpeed >= 0
        ) {

            const speed =
                nativeSpeed * 3.6;

            if (
                speed <=
                SETTINGS.maximumAllowedSpeedKmh
            ) {

                currentSpeedKmh =
                    speed;

                if (
                    speed >
                    maximumSpeedKmh
                ) {

                    maximumSpeedKmh =
                        speed;
                }
            }
        }

        updateUI();

        sendDataToJotform();

        return;
    }


    /* ====================================================
       TIME SINCE LAST READING
    ==================================================== */

    const elapsedSeconds =
        (now - lastAcceptedTime) /
        1000;


    if (
        elapsedSeconds <
        SETTINGS.minimumTimeSeconds
    ) {

        return;
    }


    /* ====================================================
       DISTANCE
    ==================================================== */

    const distance =
        distanceBetween(

            lastPosition.latitude,

            lastPosition.longitude,

            latitude,

            longitude

        );


    /*
       Calculate speed using native GPS speed
       where available.
    */

    let speedKmh = null;


    if (
        Number.isFinite(nativeSpeed) &&
        nativeSpeed >= 0
    ) {

        speedKmh =
            nativeSpeed * 3.6;
    }


    /*
       If native GPS speed is unavailable,
       calculate speed using distance/time.
    */

    if (
        speedKmh === null &&
        distance > 0
    ) {

        speedKmh =
            (distance / 1000) /
            (elapsedSeconds / 3600);
    }


    /*
       Ignore impossible readings.
    */

    if (
        speedKmh !== null &&
        speedKmh >
        SETTINGS.maximumAllowedSpeedKmh
    ) {

        console.warn(
            "Rejected GPS speed:",
            speedKmh
        );

        return;
    }


    /*
       Add distance only when there has
       actually been meaningful movement.
    */

    if (
        distance >=
        SETTINGS.minimumDistanceMeters
    ) {

        totalDistanceMeters +=
            distance;
    }


    /*
       Update speed.
    */

    if (
        speedKmh !== null &&
        Number.isFinite(speedKmh)
    ) {

        currentSpeedKmh =
            speedKmh;

        if (
            speedKmh >
            maximumSpeedKmh
        ) {

            maximumSpeedKmh =
                speedKmh;
        }
    }


    acceptedReadings++;

    lastAcceptedTime =
        now;

    lastPosition = {

        latitude:
            latitude,

        longitude:
            longitude

    };

    measurementStatus =
        "Measuring";

    setStatus(
        "GPS measurement active"
    );

    setMessage(
        "Vehicle speed is being measured automatically.",
        "success"
    );

    updateUI();

    sendDataToJotform();
}


/* ========================================================
   GPS ERROR
======================================================== */

function handlePositionError(error) {

    console.error(
        "GPS ERROR:",
        error
    );


    if (error.code === 1) {

        measurementStatus =
            "Location permission denied";

        setStatus(
            "Location permission denied"
        );

        setMessage(
            "Please allow location access in your browser. GPS speed cannot be calculated without it.",
            "error"
        );

    }

    else if (error.code === 2) {

        measurementStatus =
            "GPS unavailable";

        setStatus(
            "GPS signal unavailable"
        );

        setMessage(
            "Your device could not obtain a GPS position.",
            "error"
        );

    }

    else if (error.code === 3) {

        measurementStatus =
            "GPS timeout";

        setStatus(
            "Waiting for GPS signal..."
        );

        setMessage(
            "Waiting for the device to provide a GPS position.",
            "warning"
        );

    }

    else {

        measurementStatus =
            "GPS error";

        setStatus(
            "GPS error"
        );

        setMessage(
            error.message ||
            "Unable to obtain GPS location.",
            "error"
        );
    }


    updateUI();

    /*
       IMPORTANT:
       Send the error/status to Jotform too.
       This prevents a completely blank widget value.
    */

    sendDataToJotform();
}


/* ========================================================
   CHECK GPS PERMISSION
======================================================== */

async function checkPermission() {

    try {

        if (
            navigator.permissions &&
            navigator.permissions.query
        ) {

            const permission =
                await navigator.permissions.query({
                    name: "geolocation"
                });

            console.log(
                "Geolocation permission:",
                permission.state
            );

            if (
                permission.state === "denied"
            ) {

                measurementStatus =
                    "Location permission denied";

                setStatus(
                    "Location permission is blocked"
                );

                setMessage(
                    "Please allow location access for this browser.",
                    "error"
                );

                sendDataToJotform();

                return false;
            }
        }

    }

    catch (error) {

        console.log(
            "Permission check unavailable:",
            error
        );
    }

    return true;
}


/* ========================================================
   START GPS
======================================================== */

async function startGPS() {

    if (!navigator.geolocation) {

        measurementStatus =
            "GPS not supported";

        setStatus(
            "GPS is not supported"
        );

        setMessage(
            "This browser/device does not provide GPS location.",
            "error"
        );

        sendDataToJotform();

        return;
    }


    setStatus(
        "Requesting GPS location..."
    );

    setMessage(
        "Please allow location access when your browser asks.",
        "warning"
    );


    const permissionOK =
        await checkPermission();


    if (!permissionOK) {
        return;
    }


    /*
       FIRST LOCATION REQUEST

       This makes the browser explicitly request
       location before continuous tracking begins.
    */

    navigator.geolocation.getCurrentPosition(

        function(position) {

            console.log(
                "Initial GPS position:",
                position
            );

            handlePosition(position);


            /*
               Now start continuous tracking.
            */

            watchId =
                navigator.geolocation.watchPosition(

                    handlePosition,

                    handlePositionError,

                    {

                        enableHighAccuracy:
                            true,

                        maximumAge:
                            1000,

                        timeout:
                            20000
                    }
                );

        },

        function(error) {

            handlePositionError(
                error
            );

            /*
               Try watchPosition as well.
            */

            watchId =
                navigator.geolocation.watchPosition(

                    handlePosition,

                    handlePositionError,

                    {

                        enableHighAccuracy:
                            true,

                        maximumAge:
                            1000,

                        timeout:
                            20000
                    }
                );
        },

        {

            enableHighAccuracy:
                true,

            maximumAge:
                0,

            timeout:
                20000
        }
    );
}


/* ========================================================
   STOP GPS
======================================================== */

function stopGPS() {

    if (
        watchId !== null
    ) {

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId = null;
    }
}


/* ========================================================
   FINAL SUBMISSION
======================================================== */

function submitFinalData() {

    if (submitted) {
        return;
    }

    submitted = true;

    stopGPS();


    /*
       If we have fewer than two readings,
       don't pretend we have a reliable speed.
    */

    if (
        acceptedReadings < 2
    ) {

        if (
            measurementStatus ===
            "Measuring"
        ) {

            measurementStatus =
                "Insufficient GPS data";
        }
    }

    else {

        measurementStatus =
            "Completed";
    }


    const result =
        createResult();


    result.speedMeasurement70 =
        measurementStatus;


    console.log(
        "FINAL VEHICLE SPEED RESULT:",
        result
    );


    try {

        JFCustomWidget.sendSubmit({

            valid: true,

            value:
                JSON.stringify(result)

        });

    }

    catch (error) {

        console.error(
            "sendSubmit error:",
            error
        );

        /*
           Try sendData as fallback.
        */

        try {

            JFCustomWidget.sendData({

                valid: true,

                value:
                    JSON.stringify(result)

            });

        }

        catch (fallbackError) {

            console.error(
                "Fallback failed:",
                fallbackError
            );
        }
    }
}


/* ========================================================
   JOTFORM READY
======================================================== */

JFCustomWidget.subscribe(
    "ready",
    function() {

        console.log(
            "Vehicle Speed Monitor ready"
        );


        /*
           Send an initial value immediately.

           This is important because your previous
           version could remain completely blank if
           GPS did not return a valid reading.
        */

        measurementStatus =
            "Starting GPS";

        sendDataToJotform();


        /*
           Start GPS automatically.
        */

        startGPS();


        /*
           Refresh display every second.
        */

        setInterval(
            function() {

                updateUI();

                /*
                   Keep sending current data.
                */

                if (!submitted) {

                    sendDataToJotform();
                }

            },
            1000
        );
    }
);


/* ========================================================
   JOTFORM SUBMIT EVENT
======================================================== */

JFCustomWidget.subscribe(
    "submit",
    function() {

        submitFinalData();

    }
);

</script>

</body>
</html>
